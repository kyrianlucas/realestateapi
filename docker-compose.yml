services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: localpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/realestate
      DB_USERNAME: realestate
      DB_PASSWORD: localpassword
      DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  